[project]
name = "itad-labs"
version = "0.1.0"
description = "Учебный data-проект курса «Информационные технологии анализа данных»."
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-airflow[postgres]==2.10.5",
  "apache-airflow-providers-amazon==9.7.0",
  "apache-airflow-providers-http==5.0.0",
  "boto3==1.37.0",
  "dbt-duckdb==1.9.0",
  "duckdb==1.1.3",
  "requests==2.34.2",
]

[dependency-groups]
dev = [
  "ruff==0.8.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
